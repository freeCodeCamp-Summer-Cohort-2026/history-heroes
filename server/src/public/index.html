<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Placeholder</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f8fafc;
        color: #1e293b;
      }
      .card {
        background: white;
        padding: 2rem 3rem;
        border-radius: 8px;
        box-shadow:
          0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.75rem;
      }
      p {
        color: #64748b;
        margin-bottom: 1.5rem;
      }
      a {
        display: inline-block;
        padding: 0.6rem 1.2rem;
        background-color: #2563eb;
        color: #ffffff;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 500;
        transition: background-color 0.2s ease;
      }
      a:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Server-Side Placeholder</h1>
      <p>
        This is the server-side index placeholder, you should only see this
        during local development if you go to localhost:3000 when running the
        server. Go to the actual vite powered client below.
      </p>
      <a href="http://localhost:5173">Go to client</a>
    </div>
  </body>
</html>
