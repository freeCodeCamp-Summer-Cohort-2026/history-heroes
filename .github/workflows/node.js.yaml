name: Node.js CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Global setup
      run: npm ci

    - name: Client setup & tests
      working-directory: client
      run: |
        npm ci
        npm run lint
        npm run test
        npm run build
    
    - name: Server setup & tests
      working-directory: server
      run: |
        cp .env.example .env
        npm ci
        npm run lint
        npm run test
        npm run test:e2e
        npm run build
