name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Set `.env`
        run: cp .env.example .env

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Integration tests
        run: npm run test:e2e

      # Verifies all entity changes have corresponding migrations.
      # A failure here indicates schema drift: entity classes (server/src/**/*.entity.ts)
      # were modified or added without generating a matching TypeORM migration.
      # Fix: cd into `server/`, run `npm run migration:generate -- src/core/db/migrations/<MigrationName>`,
      # verify the generated migration file, and commit it with your entity changes.
      # See CONTRIBUTING.md ("Database changes & migrations") for details.
      - name: Check database migrations
        run: |
          npm run migration:run
          npm run migration:check
        env:
          DATABASE_STORAGE: data/ci-migration-check.sqlite

      - name: Build
        run: npm run build
